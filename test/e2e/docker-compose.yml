# End-to-end stack: NF (nf-full) + redis attached to the simulators' network.
#   docker compose -f sims/docker-compose.yml up -d --build --wait
#   docker compose -f test/e2e/docker-compose.yml up -d
#   npm run test:e2e
# NF's API is on 127.0.0.1:18090; NF is 172.31.161.20 on snmpnet (traps go there).
name: nfsnmp-e2e
services:
  redis:
    image: normalframework.azurecr.io/normalframework/redis:${NF_TAG:-3.10}
    command: redis-server /etc/redis.conf
    networks: [default]
  nf:
    image: normalframework.azurecr.io/normalframework/nf-full:${NF_TAG:-3.10}
    depends_on: [redis]
    environment:
      REDIS_ADDRESS: redis:6379
      PORT: "8080"
      S6_CMD_WAIT_FOR_SERVICES_MAXTIME: "0"
    ports: ["127.0.0.1:18090:8080"]
    networks:
      default: {}
      snmpnet:
        ipv4_address: 172.31.161.20
networks:
  snmpnet:
    external: true
