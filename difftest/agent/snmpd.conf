# Stock-ish net-snmp agent used as the non-synthetic difftest target.
# sysLocation/sysContact/sysName deliberately NOT set here so they stay writable via SET.
agentAddress udp:161
rocommunity public  default
rwcommunity private default
rouser noauth noauth
rwuser authsha auth
rwuser md5des priv
rwuser shaaes priv
rwuser sha256aes priv
rwuser sha512aes priv
rwuser sha256aes256 priv
rwuser shaaes256 priv
