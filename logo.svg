  <circle cx="68" cy="58" r="15" fill="#FFFFFF"/>
  <circle cx="124" cy="94" r="12" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="124" cy="128" r="12" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="124" cy="198" r="12" fill="#FFFFFF" opacity="0.85"/>

  <!-- the polled leaf, with signal arcs -->
  <circle cx="182" cy="128" r="44" fill="url(#glow)"/>
  <circle cx="182" cy="128" r="16" fill="#ABDFE7"/>
  <g fill="none" stroke="#ABDFE7" stroke-width="9" stroke-linecap="round">
    <path d="M202 102 A32 32 0 0 1 202 154"/>
    <path d="M216 84 A56 56 0 0 1 216 172" opacity="0.6"/>
