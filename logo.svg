<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">SNMP</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#605AEA"/>
      <stop offset="1" stop-color="#20144C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ABDFE7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ABDFE7" stop-opacity="0"/>
