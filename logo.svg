  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- OID tree: root -> branches -> leaves -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M68 58 V128 H112"/>
    <path d="M68 128 V198 H112"/>
